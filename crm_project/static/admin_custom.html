<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Beauty CRM - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .admin-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 40px 50px;
            max-width: 1100px;
            width: 100%;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eef2f7;
        }
        .admin-header h1 {
            font-size: 28px;
            color: #2d3436;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .admin-header h1 span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .admin-badge {
            background: #667eea;
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }
        .admin-card {
            background: white;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 1px solid #f0f2f5;
            cursor: pointer;
        }
        .admin-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.15);
            border-color: #667eea;
        }
        .admin-card .icon {
            font-size: 40px;
            margin-bottom: 12px;
            display: block;
        }
        .admin-card h3 {
            font-size: 16px;
            color: #2d3436;
            font-weight: 600;
        }
        .admin-card p {
            font-size: 13px;
            color: #888;
            margin-top: 5px;
        }
        .admin-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid #eef2f7;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f2f5;
            color: #2d3436;
        }
        .btn-secondary:hover {
            background: #e4e7ec;
        }
        .btn-success {
            background: #00b894;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
        }
        .admin-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
            color: #b2bec3;
        }
        .admin-footer a {
            color: #667eea;
            text-decoration: none;
        }
        @media (max-width: 768px) {
            .admin-container {
                padding: 25px 20px;
            }
            .admin-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .admin-header h1 {
                font-size: 22px;
            }
            .admin-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .admin-actions {
                flex-direction: column;
            }
            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🧴 <span>Skin Beauty CRM</span></h1>
            <span class="admin-badge">🚀 Admin Panel</span>
        </div>

        <div class="admin-grid">
            <div class="admin-card">
                <span class="icon">👤</span>
                <h3>Clients</h3>
                <p>مدیریت مشتریان</p>
            </div>
            <div class="admin-card">
                <span class="icon">🧴</span>
                <h3>Products</h3>
                <p>مدیریت محصولات</p>
            </div>
            <div class="admin-card">
                <span class="icon">💆</span>
                <h3>Services</h3>
                <p>مدیریت خدمات</p>
            </div>
            <div class="admin-card">
                <span class="icon">📅</span>
                <h3>Appointments</h3>
                <p>مدیریت نوبت‌ها</p>
            </div>
        </div>

        <div class="admin-actions">
            <a href="/admin/" class="btn btn-primary">🔐 ورود به پنل ادمین</a>
            <a href="/api/" class="btn btn-secondary">📡 مشاهده API</a>
            <a href="#" class="btn btn-success">📊 گزارشات</a>
        </div>

        <div class="admin-footer">
            <p>Skin Beauty CRM v1.0 &bull; Built with ❤️ using Django</p>
            <p style="margin-top:5px; font-size:12px;">
                <a href="/admin/">/admin/</a> &bull; 
                <a href="/api/">/api/</a> &bull; 
                <a href="#">Documentation</a>
            </p>
        </div>
    </div>
</body>
</html>
